name: Publish Docker image

on:
  push:
   branches: ["**"]
  pull_request:
    branches: ["**"]
  release:
    types: [created]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: sergiolangaritabenitez/faas-supervisor-kit
jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-20.04
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Setup go
        uses: actions/setup-go@v2
        with:
          go-version:  1.21

      - name: build
        run: |
          echo ${{ env }}
          echo $GITHUB_REF 
          echo ${GITHUB_REF#refs/tags/v}
          echo ${GITHUB_REF#refs/tags}
          echo ${GITHUB_REF#refs/tags/}
          